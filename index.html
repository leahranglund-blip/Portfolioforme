    <script>
        const hero = document.querySelector(".home-hero");
        const heroImage = document.querySelector(".home-hero-image");
        const highlandsCanvas = document.querySelector(".home-highlands-overlay");
        const highlandsContext = highlandsCanvas.getContext("2d");
        const glassImage = document.querySelector(".home-glass-texture");
        const glassCanvas = document.querySelector(".home-glass-overlay");
        const glassContext = glassCanvas.getContext("2d");
        const trailLifetime = 1400;
        const trailMarks = [];
        let pointerX = -1000;
        let pointerY = -1000;
        let trailFrame;
        let hideTimer;
        let isRevealing = false;
        let lastTrailPoint;

        function resizeRevealCanvas() {
            const bounds = hero.getBoundingClientRect();
            const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
            highlandsCanvas.width = Math.round(bounds.width * pixelRatio);
            highlandsCanvas.height = Math.round(bounds.height * pixelRatio);
            highlandsContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
            glassCanvas.width = Math.round(bounds.width * pixelRatio);
            glassCanvas.height = Math.round(bounds.height * pixelRatio);
            glassContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
            drawHeroLayers(performance.now());
        }

        function eraseSmokeSpot(context, x, y, radius, opacity) {
            const gradient = context.createRadialGradient(x, y, radius * 0.12, x, y, radius);
            gradient.addColorStop(0, `rgba(0, 0, 0, ${opacity})`);
            gradient.addColorStop(0.68, `rgba(0, 0, 0, ${opacity * 0.82})`);
            gradient.addColorStop(1, "rgba(0, 0, 0, 0)");
            context.fillStyle = gradient;
            context.beginPath();
            context.arc(x, y, radius, 0, Math.PI * 2);
            context.fill();
        }

        function drawHeroLayers(now) {
            drawHighlandsReveal(now);
            drawRevealCanvas(now);
        }

        function drawHighlandsReveal(now) {
            const bounds = hero.getBoundingClientRect();
            highlandsContext.clearRect(0, 0, bounds.width, bounds.height);
            if (heroImage.complete && heroImage.naturalWidth > 0) {
                highlandsContext.globalCompositeOperation = "source-over";
                highlandsContext.drawImage(heroImage, 0, 0, bounds.width, bounds.height);
                highlandsContext.globalCompositeOperation = "destination-out";

                for (const mark of trailMarks) {
                    const progress = (now - mark.createdAt) / trailLifetime;
                    if (progress < 1) {
                        eraseSmokeSpot(highlandsContext, mark.x, mark.y, mark.radius, mark.opacity * (1 - progress));
                    }
                }

                if (isRevealing) {
                    eraseSmokeSpot(highlandsContext, pointerX, pointerY, 62, 0.98);
                }
            }
            highlandsContext.globalCompositeOperation = "source-over";
        }

        function drawRevealCanvas(now) {
            const bounds = hero.getBoundingClientRect();
            glassContext.clearRect(0, 0, bounds.width, bounds.height);
            if (glassImage.complete && glassImage.naturalWidth > 0) {
                glassContext.globalCompositeOperation = "source-over";
                glassContext.drawImage(glassImage, 0, 0, bounds.width, bounds.height);
                glassContext.globalCompositeOperation = "destination-out";
            }

            for (let index = trailMarks.length - 1; index >= 0; index -= 1) {
                const mark = trailMarks[index];
                const progress = (now - mark.createdAt) / trailLifetime;
                if (progress >= 1) {
                    trailMarks.splice(index, 1);
                } else {
                    eraseSmokeSpot(glassContext, mark.x, mark.y, mark.radius, mark.opacity * (1 - progress));
                }
            }

            if (isRevealing) {
                eraseSmokeSpot(glassContext, pointerX, pointerY, 62, 0.98);
            }
            glassContext.globalCompositeOperation = "source-over";
        }

        function addSmokeMark(x, y, directionX, directionY, createdAt) {
            const acrossX = -directionY;
            const acrossY = directionX;
            const shapes = [
                { along: 0, across: 0, radius: 62, opacity: 0.96 },
                { along: -15, across: 17, radius: 38, opacity: 0.72 },
                { along: -29, across: -20, radius: 29, opacity: 0.62 }
            ];

            for (const shape of shapes) {
                trailMarks.push({
                    x: x + directionX * shape.along + acrossX * shape.across,
                    y: y + directionY * shape.along + acrossY * shape.across,
                    radius: shape.radius,
                    createdAt,
                    opacity: shape.opacity
                });
            }

            if (trailMarks.length > 240) {
                trailMarks.splice(0, trailMarks.length - 240);
            }
        }

        function addSmokeTrail(x, y) {
            const now = performance.now();
            const nextPoint = { x, y };

            if (!lastTrailPoint) {
                addSmokeMark(x, y, 1, 0, now);
            } else {
                const deltaX = x - lastTrailPoint.x;
                const deltaY = y - lastTrailPoint.y;
                const distance = Math.hypot(deltaX, deltaY);
                const steps = Math.max(1, Math.ceil(distance / 18));
                const directionX = distance ? deltaX / distance : 1;
                const directionY = distance ? deltaY / distance : 0;

                for (let step = 1; step <= steps; step += 1) {
                    const progress = step / steps;
                    addSmokeMark(
                        lastTrailPoint.x + deltaX * progress,
                        lastTrailPoint.y + deltaY * progress,
                        directionX,
                        directionY,
                        now
                    );
                }
            }

            lastTrailPoint = nextPoint;
            if (!trailFrame) {
                trailFrame = requestAnimationFrame(animateSmokeTrail);
            }
        }

        function animateSmokeTrail(now) {
            drawHeroLayers(now);

            if (trailMarks.length || isRevealing) {
                trailFrame = requestAnimationFrame(animateSmokeTrail);
            } else {
                trailFrame = undefined;
                lastTrailPoint = undefined;
            }
        }

        function startReveal(event) {
            const bounds = hero.getBoundingClientRect();
            pointerX = event.clientX - bounds.left;
            pointerY = event.clientY - bounds.top;
            isRevealing = true;
            clearTimeout(hideTimer);
            addSmokeTrail(pointerX, pointerY);
        }

        resizeRevealCanvas();
        window.addEventListener("resize", resizeRevealCanvas);
        new ResizeObserver(resizeRevealCanvas).observe(hero);
        heroImage.addEventListener("load", resizeRevealCanvas);
        glassImage.addEventListener("load", resizeRevealCanvas);
        hero.addEventListener("pointermove", startReveal);
        hero.addEventListener("pointerleave", () => {
            hideTimer = setTimeout(() => {
                isRevealing = false;
                pointerX = -1000;
                pointerY = -1000;
                lastTrailPoint = undefined;
                if (!trailFrame) {
                    trailFrame = requestAnimationFrame(animateSmokeTrail);
                }
            }, 900);
        });

    </script>
