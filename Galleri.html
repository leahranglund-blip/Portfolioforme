<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleri - Min portefølje</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20261013-22">
    <script src="fun-fact.js?v=20261013-1" defer></script>
</head>
<body class="gallery-body">
    <header>
        <div class="header-brand">
            <p class="logo"><a href="index.html">Hovedside</a></p>
            <a class="linkedin-link" href="https://www.linkedin.com/in/leah-ranglund-330333166/" target="_blank" rel="noopener noreferrer" aria-label="Leah Ranglund på LinkedIn">
                <img src="Bilder/linkedin%20icon.jpg" alt="">
            </a>
        </div>
        <nav aria-label="Hovedmeny">
            <ul>
                <li><a href="CV/Leah_Ranglund_CV26.pdf" target="_blank" rel="noopener noreferrer">CV</a></li>
                <li><a href="Galleri.html">Galleri</a></li>
                <li><a href="Om-meg.html">Om meg</a></li>
                <li><a href="Sertifiseringer.html">Sertifiseringer og kurs</a></li>
                <li><a href="Prosjekter.html">Prosjekter</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="gallery-page">
            <div class="gallery-carousel">
                <div class="carousel-stage" id="carousel-stage" tabindex="0" role="group" aria-label="3D-bildekarusell. Bruk venstre og høyre piltast eller dra for å bla.">
                    <div class="carousel-ring" id="carousel-ring"></div>
                </div>
            </div>
        </section>
    </main>

    <div class="image-lightbox" id="image-lightbox" role="dialog" aria-modal="true" aria-label="Forstørret bilde">
        <img id="lightbox-image" src="" alt="">
    </div>
    <aside class="fun-fact" aria-label="Fun fact om galleriet">
        <button class="fun-fact-close" type="button" aria-label="Lukk fun fact">&times;</button>
        <span class="fun-fact-label">Visste du at?</span>
        <p>Galleriet har 22 bilder som kan åpnes i stor visning.</p>
    </aside>

    <script>
        const images = [
            "sailboat.jpg",
            "waterfall.jpg",
            "buschart.jpg",
            "dragonfly.jpg",
            "gressplen.jpg",
            "roses.jpg",
            "puppydog.jpg",
            "treejapan.jpg",
            "parrot.jpg",
            "oegle.jpg",
            "frog.jpg",
            "mouse.jpg",
            "horse.jpg",
            "jellyfish.jpg",
            "susbridge.jpg",
            "boat.jpg",
            "boats.jpg",
            "Baldeagle.jpg",
            "Owl.jpg",
            "stickeropera.jpg",
            "Squirrelbw.jpg",
            "squirellrbg.jpg"
        ];

        const carouselStage = document.querySelector("#carousel-stage");
        const carouselRing = document.querySelector("#carousel-ring");
        const lightbox = document.querySelector("#image-lightbox");
        const lightboxImage = document.querySelector("#lightbox-image");
        const cards = [];
        const stepAngle = 360 / images.length;
        let selectedIndex = 0;
        let currentStep = 0;
        let rotation = 0;
        let dragStartX;
        let dragStartRotation;
        let activePointerId;
        let hasDragged = false;
        let suppressClick = false;

        function imageTitle(imageName) {
            return imageName
                .replace(/\.[^.]+$/, "")
                .replace(/([a-z])([A-Z])/g, "$1 $2")
                .replace(/[_-]+/g, " ");
        }

        images.forEach((imageName, index) => {
            const title = imageTitle(imageName);
            const card = document.createElement("button");
            card.className = "carousel-card";
            card.type = "button";
            card.setAttribute("aria-label", `Vis ${title} i full størrelse`);
            card.style.setProperty("--card-angle", `${index * stepAngle}deg`);

            const image = document.createElement("img");
            image.src = `Bilder/thumbnails/${imageName}`;
            image.dataset.fullSrc = `Bilder/${imageName}`;
            image.alt = title;
            image.loading = index < 5 ? "eager" : "lazy";
            image.decoding = "async";

            card.append(image);
            card.addEventListener("click", () => {
                if (suppressClick) {
                    suppressClick = false;
                    return;
                }
                lightboxImage.src = image.dataset.fullSrc;
                lightboxImage.alt = image.alt;
                lightbox.classList.add("is-open");
            });

            carouselRing.appendChild(card);
            cards.push(card);
        });

        function renderCarousel() {
            carouselRing.style.setProperty("--ring-rotation", `${rotation}deg`);
            cards.forEach((card, index) => {
                const distance = Math.abs(index - selectedIndex);
                const circularDistance = Math.min(distance, images.length - distance);
                card.style.visibility = circularDistance <= 3 ? "visible" : "hidden";
                card.setAttribute("aria-current", String(index === selectedIndex));
                card.tabIndex = index === selectedIndex ? 0 : -1;
            });
        }

        function updateSelectionFromRotation() {
            currentStep = Math.round(-rotation / stepAngle);
            selectedIndex = ((currentStep % images.length) + images.length) % images.length;
            renderCarousel();
        }

        function selectStep(step) {
            currentStep = step;
            selectedIndex = ((currentStep % images.length) + images.length) % images.length;
            rotation = -currentStep * stepAngle;
            renderCarousel();
        }

        carouselStage.addEventListener("wheel", (event) => {
            const distance = event.deltaX || (event.shiftKey ? event.deltaY : 0);
            if (distance === 0) {
                return;
            }

            event.preventDefault();
            rotation -= distance * 0.35;
            updateSelectionFromRotation();
        }, { passive: false });

        carouselStage.addEventListener("pointerdown", (event) => {
            if (event.pointerType === "mouse" && event.button !== 0) {
                return;
            }
            dragStartX = event.clientX;
            dragStartRotation = rotation;
            activePointerId = event.pointerId;
            hasDragged = false;
        });

        document.addEventListener("pointermove", (event) => {
            if (dragStartX === undefined || event.pointerId !== activePointerId) {
                return;
            }
            const distance = event.clientX - dragStartX;
            if (Math.abs(distance) > 5) {
                hasDragged = true;
                carouselStage.classList.add("is-dragging");
            }
            if (hasDragged) {
                event.preventDefault();
            }
            rotation = dragStartRotation + distance * 0.35;
            carouselRing.style.setProperty("--ring-rotation", `${rotation}deg`);
        });

        function finishDrag(event) {
            if (dragStartX === undefined || event.pointerId !== activePointerId) {
                return;
            }
            dragStartX = undefined;
            activePointerId = undefined;
            carouselStage.classList.remove("is-dragging");
            if (hasDragged) {
                selectStep(Math.round(-rotation / stepAngle));
                suppressClick = true;
                window.setTimeout(() => {
                    hasDragged = false;
                    suppressClick = false;
                }, 0);
            }
        }

        document.addEventListener("pointerup", finishDrag);
        document.addEventListener("pointercancel", finishDrag);

        lightbox.addEventListener("click", () => {
            lightbox.classList.remove("is-open");
            lightboxImage.src = "";
        });

        document.addEventListener("keydown", (event) => {
            const activeElement = document.activeElement;
            if (activeElement?.matches("a, input, textarea, select, [contenteditable='true']")) {
                return;
            }

            if (!lightbox.classList.contains("is-open") && event.key === "ArrowLeft") {
                event.preventDefault();
                selectStep(currentStep - 1);
                return;
            }

            if (!lightbox.classList.contains("is-open") && event.key === "ArrowRight") {
                event.preventDefault();
                selectStep(currentStep + 1);
                return;
            }

            if (event.key === "Escape" && lightbox.classList.contains("is-open")) {
                lightbox.classList.remove("is-open");
                lightboxImage.src = "";
            }
        });

        renderCarousel();
    </script>
</body>
</html>
