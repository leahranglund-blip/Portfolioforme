<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Om meg - Min portefølje</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <p class="logo"><a href="index.html">Hovedside</a></p>
        <nav aria-label="Hovedmeny">
            <ul>
                <li><a href="CV/Leah_Ranglund_CV26.pdf" target="_blank" rel="noopener noreferrer">CV</a></li>
                <li><a href="Galleri.html">Galleri</a></li>
                <li><a href="Om-meg.html">Om meg</a></li>
                <li><a href="Sertifiseringer.html">Sertifiseringer</a></li>
                <li><a href="Prosjekter.html">Prosjekter</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="about-section">
            <div class="about-copy">
                <h1>Om meg</h1>
                <p>Skriv en kort presentasjon av deg selv her.</p>
            </div>
            <div class="about-music">
                <div class="record-player">
                    <img class="record-cover" src="https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e026e423caed017991e802f8ee1" alt="Roterende, rundt albumcover for Coastal Grooves av Blood Orange">
                </div>
                <div class="spotify-player">
                    <div id="spotify-embed"></div>
                    <div class="spotify-controls" aria-label="Spotify-kontroller">
                        <button class="spotify-control" id="previous-track" type="button" aria-label="Forrige sang" title="Forrige sang">&#9198;</button>
                        <button class="spotify-control" id="toggle-track" type="button" aria-label="Spill av eller pause" title="Spill av eller pause">&#9199;</button>
                        <button class="spotify-control" id="next-track" type="button" aria-label="Neste sang" title="Neste sang">&#9197;</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const tracks = [
            {
                uri: "spotify:track:0AIpGG5dxEgnAymhdJRSZ0",
                title: "Champagne Coast",
                cover: "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e026e423caed017991e802f8ee1",
                alt: "Coastal Grooves av Blood Orange",
                theme: "spotify-playing"
            },
            {
                uri: "spotify:track:1b3UY0WcVkxQvPDGo7T36s",
                title: "Angeline",
                cover: "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02d124e1bb796385194f659200",
                alt: "Wide Awake av Rayland Baxter",
                theme: "spotify-playing--angeline"
            },
            {
                uri: "spotify:track:0SN26lNl4kDUjil8Z7yLjq",
                title: "Reverse Psychology",
                cover: "https://image-cdn-ak.spotifycdn.com/image/ab67616d00001e020353602204f376d1a16a2ea1",
                alt: "Reverse Psychology av Temper City",
                theme: "spotify-playing--reverse-psychology"
            }
        ];

        let currentTrackIndex = 0;
        let spotifyController;
        let isTrackPlaying = false;

        const coverImage = document.querySelector(".record-cover");
        const previousButton = document.querySelector("#previous-track");
        const toggleButton = document.querySelector("#toggle-track");
        const nextButton = document.querySelector("#next-track");
        const themeClasses = tracks.map((track) => track.theme);

        function setTrackTheme(track) {
            document.body.classList.remove(...themeClasses);
            if (track) {
                document.body.classList.add(track.theme);
            }
        }

        function changeTrack(direction) {
            if (!spotifyController || tracks.length < 2) {
                return;
            }

            currentTrackIndex = (currentTrackIndex + direction + tracks.length) % tracks.length;
            const track = tracks[currentTrackIndex];
            coverImage.src = track.cover;
            coverImage.alt = track.alt;
            if (isTrackPlaying) {
                setTrackTheme(track);
            }
            spotifyController.loadEntity(track.uri);
        }

        previousButton.disabled = tracks.length < 2;
        nextButton.disabled = tracks.length < 2;
        previousButton.addEventListener("click", () => changeTrack(-1));
        nextButton.addEventListener("click", () => changeTrack(1));
        toggleButton.addEventListener("click", () => spotifyController?.togglePlay());

        document.addEventListener("keydown", (event) => {
            const activeElement = document.activeElement;
            if (activeElement?.matches("input, textarea, select, [contenteditable='true']")) {
                return;
            }

            if (event.code === "Space") {
                if (activeElement?.matches("button")) {
                    return;
                }
                event.preventDefault();
                spotifyController?.togglePlay();
            } else if (event.key === "ArrowLeft") {
                event.preventDefault();
                changeTrack(-1);
            } else if (event.key === "ArrowRight") {
                event.preventDefault();
                changeTrack(1);
            }
        });

        window.onSpotifyIframeApiReady = (iframeApi) => {
            iframeApi.createController(
                document.querySelector("#spotify-embed"),
                {
                    width: "100%",
                    height: 72,
                    uri: tracks[currentTrackIndex].uri
                },
                (controller) => {
                    spotifyController = controller;
                    controller.addListener("playback_update", (event) => {
                        if (event.data.isPaused) {
                            isTrackPlaying = false;
                            setTrackTheme(null);
                            return;
                        }

                        isTrackPlaying = true;
                        const playingTrack = tracks.find((track) => track.uri === event.data.playingURI)
                            || tracks[currentTrackIndex];
                        const playingTrackIndex = tracks.indexOf(playingTrack);
                        if (playingTrackIndex !== -1) {
                            currentTrackIndex = playingTrackIndex;
                            coverImage.src = playingTrack.cover;
                            coverImage.alt = playingTrack.alt;
                        }
                        setTrackTheme(playingTrack);
                    });
                }
            );
        };
    </script>
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
